[program:dyndns-update]
command=/usr/local/bin/dyndns-updater -interval 5m
environment=DYNDNS_HOST="yourhost.dyndns.org",DYNDNS_USER="your-dyn-username",DYNDNS_PASS="YOUR_UPDATER_CLIENT_KEY",DYNDNS_STATE="/var/lib/dyndns/last-ip"
user=dyndns
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/dyndns-update.log
stderr_logfile=/var/log/dyndns-update.err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
